name: Docker images

# Costruisce le immagini dei due servizi (backend e frontend), le controlla con Trivy
# e solo se sono pulite le pubblica su GitHub Container Registry:
#   push su staging -> ghcr.io/<owner>/aac-backend:staging, aac-frontend:staging
#   push su main    -> ghcr.io/<owner>/aac-backend:latest,  aac-frontend:latest
# Ogni build ha anche il tag sha-<commit> per poter tornare indietro.
# Si costruiscono sempre entrambe, cosi' uno stesso AAC_TAG vale per tutti e due i servizi.
# Ogni lunedì ricostruisce :latest per prendere le patch dell'immagine base
# e ricontrolla le CVE uscite nel frattempo.
on:
  push:
    branches: [staging, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.76.1

jobs:
  # Configurazione (Dockerfile, compose, workflow) e segreti nel codice.
  config-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tutte le azioni sono fissate per commit SHA (supply chain); Dependabot le aggiorna.
      - name: Trivy config + secret (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          format: sarif
          output: trivy-config.sarif

      - name: Carica su Security → Code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        # Sui repo privati senza GitHub Advanced Security il caricamento non è disponibile.
        continue-on-error: true
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Trivy config + secret (blocca su HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"

  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: config-scan
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.service }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,prefix=sha-

      # 1. Build locale, senza pubblicare.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          load: true
          tags: aac-${{ matrix.service }}:scan
          pull: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # 2. Scansione dell'immagine: report completo nella tab Security.
      - name: Trivy image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: aac-${{ matrix.service }}:scan
          scanners: vuln,secret
          format: sarif
          output: trivy-${{ matrix.service }}.sarif

      - name: Carica su Security → Code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # 3. Cancello: CVE HIGH/CRITICAL con una correzione disponibile bloccano la pubblicazione.
      - name: Trivy image (blocca su HIGH/CRITICAL correggibili)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: aac-${{ matrix.service }}:scan
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # 4. Pubblicazione, solo per push/schedule/manuale (non per le pull request).
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestazioni firmate da GitHub: provenienza della build (SLSA) e SBOM dei pacchetti
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
