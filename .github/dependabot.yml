# Aggiornamenti automatici (supply chain): PR settimanali verso staging, mai su main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: staging
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    target-branch: staging
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
