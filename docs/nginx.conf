# docs.aac.run: solo file statici, pubblici (nessun login, nessun cookie, nessun dato utente)
server {
    listen 8080;
    server_name _;
    server_tokens off;
    autoindex off;
    root /usr/share/nginx/html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # CSP: tutto dal sito stesso. Eccezioni motivate:
    #   script-src 'unsafe-inline'  Starlight inserisce piccoli script inline (tema chiaro/scuro, menu); il sito e' statico,
    #                               senza login, cookie o dati degli utenti, quindi non c'e' nulla da rubare con un XSS
    #   'wasm-unsafe-eval'          la ricerca interna (Pagefind) gira in WebAssembly nel browser
    #   style-src 'unsafe-inline'   stili inline dei componenti
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # file con l'impronta nel nome: in cache a lungo
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
