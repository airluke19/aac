<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<title>Accedi · AAC</title>
<link rel="icon" href="/logo.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('coach-tema'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root, [data-theme="dark"] { color-scheme: dark; --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e; --text: #fff; --muted: rgba(235,235,245,.6); --accent: #30d158; --warn: #ff9f0a; --danger: #ff453a; --line: rgba(84,84,88,.45); }
  [data-theme="light"] { color-scheme: light; --bg: #f2f2f7; --surface: #fff; --surface-2: #f2f2f7; --text: #000; --muted: rgba(60,60,67,.6); --accent: #248a3d; --warn: #c93400; --danger: #d70015; --line: rgba(60,60,67,.18); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  body::before { content: ''; position: fixed; inset: -20% -20% auto; height: 70%; pointer-events: none;
    background: radial-gradient(60% 60% at 50% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%); }
  main { position: relative; width: 100%; max-width: 380px; text-align: center; }
  .logo { width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 20px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { margin: 0; font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; }
  .sub { margin: 8px auto 30px; color: var(--muted); font-size: 1rem; line-height: 1.45; max-width: 320px; }
  .card { background: var(--surface); border-radius: 22px; padding: 22px 20px; }
  .g-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 52px; border-radius: 14px; border: 1px solid #dadce0; background: #fff; color: #1f1f1f;
    font: 600 1rem/1 inherit; font-family: inherit; text-decoration: none; cursor: pointer; transition: transform .08s, box-shadow .2s; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .g-btn:active { transform: scale(.98); }
  .g-btn svg { width: 20px; height: 20px; }
  .nota { margin: 14px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.45; }
  .msg { margin: 0 0 16px; padding: 12px 14px; border-radius: 14px; font-size: .9rem; line-height: 1.45; text-align: left; background: var(--surface-2); }
  .msg b { display: block; margin-bottom: 2px; }
  .msg.warn b { color: var(--warn); } .msg.err b { color: var(--danger); } .msg.ok b { color: var(--accent); }
  .link { margin-top: 16px; background: none; border: 0; color: var(--accent); font: 600 .95rem inherit; font-family: inherit; cursor: pointer; }
  .feat { display: flex; justify-content: center; gap: 18px; margin: 26px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: .78rem; }
  .feat li { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .feat i { width: 34px; height: 34px; border-radius: 11px; background: var(--surface); display: grid; place-items: center; font-style: normal; font-size: 1rem; }
  .demo-link { display: inline-block; margin-top: 18px; color: var(--accent); font-weight: 600; font-size: .95rem; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/apple-touch-icon.png?v=4" alt="">
  <h1>AI Adaptive Coach</h1>
  <p class="sub" id="sub">Il tuo piano di corsa che si adatta a come stai, dai dati del tuo orologio.</p>
  <div class="card">
    <div id="msg" class="msg" hidden></div>
    <a id="btn-google" class="g-btn" href="/auth/google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span id="btn-t">Accedi con Google</span>
    </a>
    <button id="btn-esci" class="link" type="button" hidden>Usa un altro account</button>
    <p class="nota" id="nota">L’accesso è su invito: se è la prima volta, la tua richiesta arriva all’amministratore.</p>
  </div>
  <a class="demo-link" id="demo-link" href="/demo">Guarda la demo con dati simulati →</a>
  <ul class="feat">
    <li><i>🗓️</i><span id="f1">Piano adattivo</span></li>
    <li><i>❤️</i><span id="f2">Recupero</span></li>
    <li><i>📈</i><span id="f3">Progressi</span></li>
  </ul>
</main>
<script>
  (function () {
    var en = (function () { try { return localStorage.getItem('coach-lingua') === 'en'; } catch (e) { return false; } })();
    var T = function (it, e) { return en ? e : it; };
    if (en) {
      document.documentElement.lang = 'en';
      document.title = 'Sign in · AAC';
      document.getElementById('sub').textContent = 'Your running plan that adapts to how you feel, from your watch data.';
      document.getElementById('btn-t').textContent = 'Sign in with Google';
      document.getElementById('btn-esci').textContent = 'Use another account';
      document.getElementById('nota').textContent = 'Access is by invitation: if this is your first time, your request goes to the administrator.';
      document.getElementById('f1').textContent = 'Adaptive plan';
      document.getElementById('demo-link').textContent = 'See the demo with simulated data →';
      document.getElementById('f2').textContent = 'Recovery';
      document.getElementById('f3').textContent = 'Progress';
    }
    var q = new URLSearchParams(location.search);
    var msg = document.getElementById('msg');
    var mostra = function (cls, titolo, testo) { msg.className = 'msg ' + cls; msg.innerHTML = '<b>' + titolo + '</b>' + testo; msg.hidden = false; };
    var errori = {
      richiesta: T('La richiesta di accesso è scaduta o non è valida. Riprova.', 'The sign-in request expired or is invalid. Please try again.'),
      email: T('Il tuo account Google non ha un’email verificata.', 'Your Google account has no verified email.'),
      google: T('Non è stato possibile completare l’accesso con Google. Riprova tra poco.', 'Could not complete Google sign-in. Please try again shortly.'),
      pieno: T('Troppe richieste in attesa: riprova più tardi.', 'Too many pending requests: try again later.')
    };
    if (q.get('errore')) mostra('err', T('Accesso non riuscito', 'Sign-in failed'), errori[q.get('errore')] || errori.google);

    fetch('/auth/stato', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
      if (!s.login) { location.replace('/'); return; }
      var u = s.utente;
      if (u && u.stato === 'attivo') { location.replace('/'); return; }
      if (u && u.stato === 'in_attesa') {
        mostra('warn', T('Richiesta inviata', 'Request sent'), T('Ciao ' + (u.nome || u.email) + ', l’amministratore deve approvare il tuo accesso (' + u.email + '). Riprova più tardi.', 'Hi ' + (u.nome || u.email) + ', the administrator needs to approve your access (' + u.email + '). Please check back later.'));
        document.getElementById('btn-t').textContent = T('Controlla di nuovo', 'Check again');
        document.getElementById('btn-esci').hidden = false;
        document.getElementById('nota').hidden = true;
      } else if (q.get('stato') === 'bloccato') {
        mostra('err', T('Accesso non consentito', 'Access not allowed'), T('Questo account non può accedere.', 'This account cannot sign in.'));
      }
    }).catch(function () {});

    document.getElementById('btn-esci').addEventListener('click', function () {
      fetch('/auth/logout', { method: 'POST', credentials: 'same-origin', headers: { 'X-Requested-With': 'coach' } }).finally(function () { location.replace('/login.html'); });
    });
  })();
</script>
</body>
</html>
