<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AAC</title>
<link rel="icon" href="/logo.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<meta name="apple-mobile-web-app-title" content="AAC">
<script>
  // Applica il tema prima del primo disegno (niente lampo bianco/nero)
  (function () {
    var t = null;
    try { t = localStorage.getItem('coach-tema'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    var c = null;
    try { c = localStorage.getItem('coach-colore'); } catch (e) {}
    document.documentElement.setAttribute('data-accent', c || 'verde');
  })();
</script>
<style>
  /* Stile Apple: colori di sistema iOS, chiaro e scuro */
  :root, [data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --surface-3: #3a3a3c;
    --line: rgba(84, 84, 88, 0.45);
    --line-strong: rgba(84, 84, 88, 0.75);
    --text: #ffffff;
    --text-2: rgba(235, 235, 245, 0.78);
    --muted: #8e8e93;
    --accent: #30d158;
    --accent-2: #2a9db0;
    --accent-ink: #00230b;
    --fill: rgba(120, 120, 128, 0.24);
    --ok: #30d158;
    --warn: #ff9f0a;
    --orange: #ff9f0a;
    --danger: #ff453a;
    --shadow: none;
    --chart-grid: rgba(84, 84, 88, 0.35);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f2f2f7;
    --surface: #ffffff;
    --surface-2: #f2f2f7;
    --surface-3: #e5e5ea;
    --line: rgba(60, 60, 67, 0.12);
    --line-strong: rgba(60, 60, 67, 0.22);
    --text: #000000;
    --text-2: rgba(60, 60, 67, 0.85);
    --muted: #8a8a8e;
    --accent: #248a3d;
    --accent-2: #0891b2;
    --accent-ink: #ffffff;
    --fill: rgba(120, 120, 128, 0.12);
    --ok: #248a3d;
    --warn: #c93400;
    --orange: #c93400;
    --danger: #d70015;
    --shadow: none;
    --chart-grid: rgba(60, 60, 67, 0.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background:
      radial-gradient(900px 420px at 15% -8%, var(--bg-glow-1), transparent 60%),
      radial-gradient(800px 400px at 95% 0%, var(--bg-glow-2), transparent 60%),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45; -webkit-font-smoothing: antialiased;
    padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    transition: background-color .25s ease, color .25s ease;
  }
  .wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Header ---------- */
  /* su iPhone la pagina passa sotto la barra di stato: l'intestazione fissa tiene lo spazio dell'area sicura */
  header { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 0; z-index: 10;
    margin: calc(-1 * max(14px, env(safe-area-inset-top))) -14px 0; padding: max(14px, env(safe-area-inset-top)) 14px 14px; backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
    background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center; }
  .logo svg { width: 38px; height: 38px; display: block; overflow: visible; }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { margin: 0; font-size: 1.12rem; font-weight: 800; letter-spacing: -0.01em; }
  .brand h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 0.74rem; font-weight: 600; letter-spacing: 0.02em; }
  .badge { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; }
  .badge.sim { color: var(--orange); border-color: color-mix(in srgb, var(--orange) 50%, transparent); }
  .badge.real { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface);
    color: var(--text); display: grid; place-items: center; cursor: pointer; flex: 0 0 auto; transition: transform .12s ease, background .2s ease; }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:active { transform: scale(0.95); }
  .icon-btn svg { width: 19px; height: 19px; }
  .lang-btn { font: inherit; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; }
  [data-theme="dark"] .ico-sun, [data-theme="light"] .ico-moon { display: block; }
  [data-theme="dark"] .ico-moon, [data-theme="light"] .ico-sun { display: none; }

  .btn-sync { position: relative; overflow: hidden; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 46px; padding: 10px 16px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface);
    color: var(--text); font: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: transform .12s ease, background .2s ease; }
  .btn-sync:hover { background: var(--surface-2); }
  .btn-sync:active { transform: scale(0.985); }
  .btn-sync:disabled { cursor: progress; }
  .btn-sync .ico { width: 18px; height: 18px; color: var(--accent-2); }
  .btn-sync.loading .ico { animation: spin .9s linear infinite; }
  .sync-btn .ico { width: 19px; height: 19px; }
  .sync-btn.loading .ico { animation: spin .9s linear infinite; }
  .sync-btn { position: relative; }
  .sync-btn.err::after { content: ''; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--surface); }
  body.demo #btn-sync { display: none; }
  .sync-info { color: var(--muted); font-size: 0.74rem; text-align: center; min-height: 1.1em; margin-top: 6px; }
  .sync-info b { color: var(--text-2); font-weight: 600; }
  .sync-info .err { color: var(--danger); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Sezioni e card ---------- */
  .sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 10px 2px -4px; }
  .sec-title h2 { margin: 0; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .sec-title span { font-size: 0.74rem; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 2px; font-size: 0.95rem; font-weight: 700; }
  .card .sub { margin: 0 0 12px; color: var(--muted); font-size: 0.76rem; }
  .grid-2 { display: grid; gap: 12px; }
  .grid-2 > *, .grid-3 > *, .wrap > * { min-width: 0; }
  .grid-3 { display: grid; gap: 12px; }

  /* ---------- Hero: prossima seduta ---------- */
  .hero { position: relative; overflow: hidden; border-radius: 24px; padding: 20px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
    background:
      radial-gradient(500px 220px at 100% 0%, color-mix(in srgb, var(--accent-2) 18%, transparent), transparent 70%),
      radial-gradient(420px 220px at 0% 100%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      var(--surface);
    box-shadow: var(--shadow); }
  .hero .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .hero .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); animation: beat 2s ease-in-out infinite; }
  @keyframes beat { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 6%, transparent); } }
  .hero h2 { margin: 8px 0 2px; font-size: 1.5rem; line-height: 1.15; letter-spacing: -0.02em; }
  .hero .when { color: var(--text-2); font-size: 0.9rem; }
  .hero .when::first-letter, .mini p::first-letter { text-transform: uppercase; }
  .hero-stats { display: flex; gap: 22px; flex-wrap: wrap; margin: 16px 0 14px; }
  .hero-stats div { display: flex; flex-direction: column; }
  .hero-stats b { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .hero-stats span { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .timeline { display: flex; gap: 3px; height: 12px; border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
  .timeline .seg { height: 100%; }
  .seg.walk { background: color-mix(in srgb, var(--muted) 45%, transparent); }
  .seg.run { background: var(--accent); }
  .seg.cool { background: color-mix(in srgb, var(--accent-2) 55%, transparent); }
  .phases { display: grid; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
  .phases li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: baseline; font-size: 0.86rem; color: var(--text-2); }
  .phases li b { color: var(--text); font-size: 0.8rem; }
  .phases li .m { font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
  .hero .tip { margin-top: 14px; padding: 11px 13px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); font-size: 0.83rem; color: var(--text-2); }
  .legend-inline { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.72rem; color: var(--muted); }
  .legend-inline i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }


  .mini { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; }
  .mini .n { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; color: var(--accent-2);
    background: color-mix(in srgb, var(--accent-2) 12%, transparent); }
  .mini h4 { margin: 0; font-size: 0.88rem; }
  .mini p { margin: 1px 0 0; font-size: 0.76rem; color: var(--muted); }
  .mini .d { font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .mini .d small { font-size: 0.7rem; color: var(--muted); font-weight: 600; }

  /* ---------- Calendario ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-head h3 { margin: 0; font-size: 1rem; text-transform: capitalize; }
  .icon-btn.sm { width: 34px; height: 34px; border-radius: 10px; font-size: 1.2rem; line-height: 1; font-family: inherit; }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-dow { margin-bottom: 5px; }
  .cal-dow span { text-align: center; font-size: 0.66rem; font-weight: 800; color: var(--muted); letter-spacing: 0.06em; }
  .cd { aspect-ratio: 1 / 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font: inherit; color: var(--muted); background: transparent; border: 1.5px solid transparent; padding: 0; min-height: 38px; }
  .cd .g { font-size: 0.82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cd .m { font-size: 0.62rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cd.vuoto { visibility: hidden; }
  .cd.oggi { border-color: var(--line-strong); color: var(--text); }
  .cd.oggi .g { font-weight: 800; }
  button.cd { cursor: pointer; transition: transform .12s ease; }
  button.cd:active { transform: scale(0.94); }
  .cd.futura { background: color-mix(in srgb, var(--accent-2) 14%, transparent); border-color: color-mix(in srgb, var(--accent-2) 55%, transparent); color: var(--text); }
  .cd.futura .m { color: var(--accent-2); }
  .cd.fatta { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .cd.saltata { border-style: dashed; border-color: var(--muted); color: var(--muted); }
  .cd.sel { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent-2); }
  .cal-det { margin-top: 16px; padding: 16px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); scroll-margin-top: 150px; animation: comparsa .25s ease; }
  @keyframes comparsa { from { opacity: 0; transform: translateY(6px); } }
  .cal-det .hero-stats { margin: 12px 0 12px; }
  .cal-det .hero-stats b { font-size: 1.5rem; }
  .cal-det .tip { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 0.8rem; color: var(--text-2); }
  .cal-det-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .cal-det-head > div { display: flex; flex-direction: column; }
  .cal-det-head b { font-size: 0.95rem; }
  .cal-det-head b::first-letter { text-transform: uppercase; }
  .cal-det-head span { font-size: 0.75rem; color: var(--muted); }
  .stato { flex: 0 0 auto; font-size: 0.68rem !important; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line-strong); }
  .stato.fatta { color: var(--accent-ink) !important; background: var(--accent); border-color: var(--accent); }
  .stato.oggi, .stato.futura { color: var(--accent-2) !important; border-color: color-mix(in srgb, var(--accent-2) 55%, transparent); }
  .stato.saltata { border-style: dashed; }
  button.mini { width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer; transition: transform .12s ease, border-color .2s ease; }
  button.mini:hover { border-color: color-mix(in srgb, var(--accent-2) 45%, transparent); }
  button.mini:active { transform: scale(0.985); }

  /* ---------- Obiettivo ---------- */
  .goal { border-radius: 24px; padding: 20px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .goal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .goal .eyebrow { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .goal h2 { margin: 4px 0 0; font-size: 1.35rem; letter-spacing: -0.02em; }
  .goal-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 18px; margin: 16px 0 14px; }
  .goal-stats div { display: flex; flex-direction: column; }
  .goal-stats b { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .goal-stats b small { font-size: 0.85rem; color: var(--muted); }
  .goal-stats span { font-size: 0.7rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
  .pill { flex: 0 0 auto; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .pill.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .fasi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
  .fase { padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
  .fase b { font-size: 0.8rem; }
  .fase span { font-size: 0.72rem; color: var(--muted); }
  .fase.in_corso { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 9%, var(--surface-2)); }
  .fase.in_corso b em { font-style: normal; color: var(--accent); font-weight: 700; }
  .fase.completata b::after { content: " ✓"; color: var(--accent); }
  .fase.futura { opacity: .7; }
  .coach { border-radius: 16px; padding: 12px 14px; background: color-mix(in srgb, var(--accent-2) 8%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--accent-2) 30%, transparent); }
  .coach-h { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 6px; }
  .coach ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 0.85rem; color: var(--text-2); }
  .goal .fine { margin: 10px 2px 0; font-size: 0.72rem; color: var(--muted); }
  .fase-tag { margin-left: 4px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); letter-spacing: 0.04em; }
  .adapt { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; font-size: 0.82rem; color: var(--text-2);
    background: color-mix(in srgb, var(--warn) 10%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); }
  .adapt b { color: var(--warn); }
  .seg.fast { background: var(--orange); }
  .cd.gara { border-color: var(--accent) !important; }
  .cd.adattata { border-color: var(--warn) !important; }
  .azioni { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .azioni:empty { display: none; }
  .btn-mini { font: inherit; font-size: 0.8rem; font-weight: 700; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); cursor: pointer; }
  .btn-mini:hover { background: var(--surface-3); }
  .week .pill { font-size: 0.62rem; }

  /* ---------- Storico ---------- */
  :root, [data-theme="dark"] { --zone-1: #0f3d1c; --zone-2: #17652d; --zone-3: #1f8f3e; --zone-4: #30d158; --zone-5: #8ef0a9; --zi-1: #d9f5e1; --zi-2: #ffffff; --zi-3: #ffffff; --zi-4: #00230b; --zi-5: #00230b; }
  [data-theme="light"] { --zone-1: #d9f5e1; --zone-2: #9fe3b2; --zone-3: #4cc76f; --zone-4: #248a3d; --zone-5: #145a26; --zi-1: #0b2e14; --zi-2: #0b2e14; --zi-3: #0b2e14; --zi-4: #ffffff; --zi-5: #ffffff; }
  .zchip { display: inline-block; font-size: 0.62rem; font-weight: 800; padding: 2px 6px; border-radius: 6px; vertical-align: 1px; }
  .zchip.z1 { background: var(--zone-1); color: var(--zi-1); } .zchip.z2 { background: var(--zone-2); color: var(--zi-2); }
  .zchip.z3 { background: var(--zone-3); color: var(--zi-3); } .zchip.z4 { background: var(--zone-4); color: var(--zi-4); }
  .zchip.z5 { background: var(--zone-5); color: var(--zi-5); }
  .tile .v small { font-size: 0.78rem; color: var(--muted); font-weight: 600; margin-left: 3px; }
  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .list-head h3 { margin: 0; }
  .filtri { display: flex; gap: 8px; flex-wrap: wrap; }
  .filtri select { font: inherit; font-size: 0.8rem; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); }
  .zone-leg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.7rem; color: var(--muted); margin-bottom: 12px; }
  .run-head, .run-row { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr 1.1fr; gap: 8px; align-items: center; }
  .run-head { font-size: 0.64rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); padding: 0 10px 6px; }
  .run-head span:not(:first-child), .r-v { text-align: right; }
  .run { border-top: 1px solid var(--line); }
  .run-row { width: 100%; font: inherit; color: var(--text-2); background: transparent; border: 0; padding: 11px 10px; cursor: pointer; text-align: left; border-radius: 12px; font-variant-numeric: tabular-nums; font-size: 0.84rem; }
  .run-row:hover { background: var(--surface-2); }
  .run.open .run-row { background: var(--surface-2); }
  .r-data { display: flex; flex-direction: column; min-width: 0; }

  /* ---------- Piano 8 settimane ---------- */
  .progress { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; margin: 6px 0 14px; }

  .weeks { display: grid; gap: 6px; }

  .week.current { background: var(--surface-2); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .week .wn { font-weight: 800; color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }

  /* ---------- KPI / tile ---------- */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

  .tile .l svg { width: 14px; height: 14px; color: var(--accent-2); }
  .tile .v { font-size: 1.7rem; font-weight: 800; margin-top: 4px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 0.78rem; color: var(--muted); font-weight: 600; margin-left: 2px; }
  .tile .n { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .tile .n b { color: var(--text-2); font-weight: 700; }

  /* ---------- Banner zona coach ---------- */
  .zona { --c: var(--accent); border-radius: 20px; padding: 16px 18px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 12%, var(--surface)), var(--surface) 70%); box-shadow: var(--shadow); }
  .zona.arancione { --c: var(--orange); }

  .zona h3 { margin: 0; font-size: 1rem; }
  .zona p { margin: 8px 0 0; color: var(--text-2); font-size: 0.88rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 0.72rem; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; }

  /* ---------- Grafici ---------- */
  .chart-box { position: relative; height: 240px; }
  .chart-box.sm { height: 150px; }
  .chart-empty { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 0.8rem; text-align: center; border: 1px dashed var(--line-strong); border-radius: 14px; }

  /* ---------- Tabelle ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
  th { text-align: right; color: var(--muted); font-weight: 700; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.07em; padding: 0 0 8px; white-space: nowrap; }
  td { text-align: right; padding: 10px 0; border-top: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  td:first-child { color: var(--text); }
  td .tipo { display: inline-flex; align-items: center; gap: 8px; }

  .empty { text-align: center; color: var(--muted); padding: 22px 10px; font-size: 0.88rem; }
  .skeleton { height: 90px; border-radius: 20px; background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size: 200% 100%; animation: sk 1.3s linear infinite; }

  .toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translate(-50%, 30px); opacity: 0;
    max-width: calc(100% - 28px); padding: 12px 16px; border-radius: 14px; font-size: 0.86rem; font-weight: 600; z-index: 30; color: var(--text);
    background: var(--surface); border: 1px solid var(--line-strong); box-shadow: 0 16px 40px -12px rgba(0,0,0,.45); transition: all .25s ease; pointer-events: none; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.ok { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .toast.err { border-color: color-mix(in srgb, var(--danger) 60%, transparent); }

  footer { color: var(--muted); font-size: 0.7rem; text-align: center; padding-top: 8px; }

  @media (min-width: 760px) {
    header { flex-direction: row; align-items: center; }
    .top { flex: 1; }

  /* ===================== Stile Apple ===================== */
  body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    letter-spacing: -0.008em; }
  h1, h2, h3, .hero-stats b, .goal-stats b, .tile .v, .pv-big b, .pv-sum b { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; }

  /* etichette: niente maiuscolo, niente sfumature */
  .badge, .hero .eyebrow, .hero-stats span, .goal .eyebrow, .goal-stats span, .pill, .coach-h, .stato, .run-head, .met span,
  .pace-top small, .pace-real small, .pv-sum small, .pv-simple > b, .g-eyebrow, .g-body h5, .tipi summary, .tile .l, th, .cal-dow span {

  /* barra superiore traslucida */

  /* card: superfici piene, angoli continui, nessun bordo */
  .card, .tile, .goal, .hero, .pv-sum, .zona, .guida { border: 0; border-radius: 18px; box-shadow: none; background: var(--surface); }
  .card h3 { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }

  .tile .l { font-size: 0.8rem; font-weight: 600; }

  .met, .pace-top > div, .pace-z, .pace-real, .pv-chip, .fase, .tipo-s, .g-kpi, .g-node, .g-tool, .g-phases span, .g-zones, .cal-det, .hero .tip, .cal-det .tip, .coach, .pv-simple {
    border: 0; border-radius: 12px; background: var(--surface-2); }

  /* obiettivo */

  .hero h2 { font-weight: 700; letter-spacing: -0.025em; }

  /* Allenamenti: schede in evidenza, raggruppate per mese */

  /* ---- Colore principale scelto dall'utente (colori di sistema Apple, varianti scuro/chiaro) ---- */

  [data-theme="light"][data-accent="menta"]  { --accent: #0c817b; --accent-ink: #ffffff; }
  [data-theme="dark"][data-accent="azzurro"] { --accent: #64d2ff; --accent-ink: #002a3d; }
  [data-theme="light"][data-accent="azzurro"]{ --accent: #0071a4; --accent-ink: #ffffff; }
  [data-theme="dark"][data-accent="blu"]     { --accent: #0a84ff; --accent-ink: #00172e; }
  [data-theme="light"][data-accent="blu"]    { --accent: #0066cc; --accent-ink: #ffffff; }
  [data-theme="dark"][data-accent="indaco"]  { --accent: #7d7aff; --accent-ink: #0b0a33; }
  [data-theme="light"][data-accent="indaco"] { --accent: #3634a3; --accent-ink: #ffffff; }
  [data-theme="dark"][data-accent="viola"]   { --accent: #bf5af2; --accent-ink: #1f0029; }
  [data-theme="light"][data-accent="viola"]  { --accent: #8944ab; --accent-ink: #ffffff; }
  [data-theme="dark"][data-accent="ambra"]     { --accent: #ffb340; --accent-ink: #2b1a00; }
  [data-theme="light"][data-accent="ambra"]    { --accent: #a15c00; --accent-ink: #ffffff; }
  [data-theme="dark"][data-accent="arancio"]   { --accent: #ff9f0a; --accent-ink: #2b1600; }
  [data-theme="light"][data-accent="arancio"]  { --accent: #c24e00; --accent-ink: #ffffff; }
  [data-theme="dark"][data-accent="mandarino"] { --accent: #ff7a45; --accent-ink: #2b0d00; }
  [data-theme="light"][data-accent="mandarino"]{ --accent: #c2410c; --accent-ink: #ffffff; }
  /* zone cardiache: stessa scala, nel colore scelto */
  [data-theme="dark"][data-accent]:not([data-accent="verde"]) {
    --ok: var(--accent);
    --zone-1: color-mix(in srgb, var(--accent) 28%, #000); --zone-2: color-mix(in srgb, var(--accent) 48%, #000); --zone-3: color-mix(in srgb, var(--accent) 70%, #000);
    --zone-4: var(--accent); --zone-5: color-mix(in srgb, var(--accent) 55%, #fff);
    --zi-1: #fff; --zi-2: #fff; --zi-3: #fff; --zi-4: var(--accent-ink); --zi-5: #111;
  }
  [data-theme="light"][data-accent]:not([data-accent="verde"]) {
    --ok: var(--accent);
    --zone-1: color-mix(in srgb, var(--accent) 15%, #fff); --zone-2: color-mix(in srgb, var(--accent) 35%, #fff); --zone-3: color-mix(in srgb, var(--accent) 60%, #fff);
    --zone-4: var(--accent); --zone-5: color-mix(in srgb, var(--accent) 70%, #000);
    --zi-1: #111; --zi-2: #111; --zi-3: #111; --zi-4: var(--accent-ink); --zi-5: #fff;
  }
  /* con le sfumature di arancio: gli avvisi passano al giallo e le conferme restano verdi, per non confonderli con il colore principale */
  [data-theme="dark"][data-accent]:not([data-accent="verde"]):is([data-accent="ambra"], [data-accent="arancio"], [data-accent="mandarino"]) { --warn: #ffd60a; --ok: #30d158; }
  [data-theme="light"][data-accent]:not([data-accent="verde"]):is([data-accent="ambra"], [data-accent="arancio"], [data-accent="mandarino"]) { --warn: #946200; --ok: #248a3d; }

    background: color-mix(in srgb, var(--surface) 82%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 8px 30px rgba(0,0,0,.28), inset 0 0 0 0.5px rgba(128,128,128,.25); }

  .dd-prev { color: var(--muted); text-align: right; }
  .dd-row b { text-align: right; font-weight: 600; }
  .dd-row em { font-style: normal; text-align: right; font-size: 0.82rem; font-weight: 600; color: var(--muted); }
  .dd-row em.ok { color: var(--ok); } .dd-row em.warn { color: var(--warn); }
  .dd-verdict { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; font-size: 0.88rem; font-weight: 500; }
  .dd-verdict.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
  .dd-verdict.warn { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
  .dd-verdict.bad { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }

  .dd-strip { display: flex; gap: 2px; height: 12px; border-radius: 4px; overflow: hidden; margin: 4px 0 8px; }
  .dd-strip i.run { background: var(--accent); } .dd-strip i.walk { background: var(--surface-3); }
  .dd-ch { margin-top: 14px; }
  .dd-ch-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .dd-ch-h b { font-size: 0.88rem; font-weight: 600; }
  .dd-ch-h span { font-size: 0.74rem; color: var(--muted); }
  .dd-ch .chart-box.sm { height: 150px; }

  .dd-zones { display: grid; gap: 10px; }
  .dd-zone { display: grid; grid-template-columns: 34px minmax(0, 1.1fr) 2fr 70px; gap: 10px; align-items: center; }
  .dd-zone .zchip { text-align: center; }
  .dd-zn { display: flex; flex-direction: column; font-size: 0.84rem; min-width: 0; }
  .dd-zn small { font-size: 0.72rem; color: var(--muted); }
  .dd-zone > i { display: block; height: 10px; border-radius: 999px; background: var(--fill); overflow: hidden; }
  .dd-zone > i b { display: block; height: 100%; border-radius: 999px; }
  .dd-zv { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.88rem; display: flex; flex-direction: column; }
  .dd-zv small { font-size: 0.72rem; color: var(--muted); font-weight: 500; }

  .dd-callout { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 10%, var(--surface-2)); margin-bottom: 12px; }
  .dd-callout b { font-size: 1rem; }
  .dd-callout span { font-size: 0.84rem; color: var(--text-2); }
  .dd-table { display: grid; font-variant-numeric: tabular-nums; }
  .dd-tr { display: grid; grid-template-columns: 26px repeat(5, minmax(0, 1fr)); gap: 6px; padding: 8px 0; border-top: 0.5px solid var(--line-strong); font-size: 0.86rem; text-align: right; }
  .dd-tr span:first-child { text-align: left; color: var(--muted); }
  .dd-th { border-top: 0; font-size: 0.72rem; color: var(--muted); padding-top: 0; }
  .dd-th span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dd-splits { display: grid; gap: 6px; }
  .dd-split { display: grid; grid-template-columns: 34px 1fr 52px minmax(0, 0.9fr); gap: 10px; align-items: center; font-variant-numeric: tabular-nums; font-size: 0.86rem; }
  .dd-split > span { color: var(--muted); }
  .dd-split > i { display: block; height: 16px; border-radius: 5px; background: var(--fill); overflow: hidden; }
  .dd-split > i b { display: block; height: 100%; background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 5px; }
  .dd-split.best > i b { background: var(--accent); }
  .dd-split > b { text-align: right; }
  .dd-split > small { font-size: 0.74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dd-actions { margin-top: 0; }
  a.btn-mini { text-decoration: none; }

  .m-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
  .m-chips::-webkit-scrollbar { display: none; }
  .m-chip { flex: 0 0 auto; border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 0.86rem; font-weight: 600; background: var(--surface); color: var(--text); cursor: pointer; min-height: 36px; }
  .m-chip.on { background: var(--accent); color: var(--accent-ink); }
  .seg-ctl { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; }
  .seg-ctl button { flex: 1; border: 0; background: none; font: inherit; font-size: 0.82rem; font-weight: 600; padding: 7px 8px; border-radius: 7px; color: var(--text); cursor: pointer; }
  .seg-ctl button.on { background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.14); }
  [data-theme="dark"] .seg-ctl button.on { background: var(--surface-3); }
  .dd-big { display: flex; flex-direction: column; margin: 14px 0 6px; }
  .dd-big span { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .dd-big b { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .dd-big b small { font-size: 1rem; color: var(--muted); font-weight: 600; }
  .dd-big > small { font-size: 0.82rem; color: var(--muted); }
  .dd-hchart { height: 240px; margin-top: 6px; }
  .dd-health .legend-inline { margin-top: 10px; }
  .dd-p { margin: 4px 0 0; font-size: 0.9rem; color: var(--text-2); line-height: 1.5; }
  .dd-p b { color: var(--text); }
  .dd-h2 { margin-top: 16px !important; }
  .dd-list { display: grid; }
  .dd-li { display: flex; flex-direction: column; padding: 10px 0; border-top: 0.5px solid var(--line-strong); }
  .dd-li:first-child { border-top: 0; }
  .dd-li b { font-size: 0.88rem; font-weight: 600; }
  .dd-li b::first-letter { text-transform: uppercase; }
  .dd-li span { font-size: 0.82rem; color: var(--warn); }

  /* voci che aprono un approfondimento */
  .tile-btn { font: inherit; color: inherit; text-align: left; cursor: pointer; border: 0; width: 100%; transition: transform .12s ease; }
  .tile-btn:active { transform: scale(0.98); }
  .tile .chev { margin-left: auto; color: var(--muted); font-size: 1.1rem; line-height: 1; }
  .link-btn { border: 0; background: none; color: var(--accent); font: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer; padding: 6px 0; }
  .sec-title .link-btn { font-size: 0.9rem; }
  @media (max-width: 520px) {
    .dd-zone { grid-template-columns: 30px minmax(0, 1fr) 1.2fr 58px; gap: 8px; }
    .dd-tr { font-size: 0.8rem; gap: 4px; }
    .dd-row { grid-template-columns: 1.1fr 1fr 1fr 0.9fr; font-size: 0.88rem; }
    .dd-split { grid-template-columns: 30px 1fr 46px 0.9fr; gap: 8px; }
  }

  /* ---- Colori per categoria, come Apple Salute ---- */
  :root, [data-theme="dark"] { --c-cuore: #ff453a; --c-attivita: #ff9f0a; --c-respiro: #0a84ff; --c-sonno: #bf5af2; --c-corpo: #ac8e68; }
  [data-theme="light"] { --c-cuore: #ff3b30; --c-attivita: #f57a00; --c-respiro: #007aff; --c-sonno: #af52de; --c-corpo: #a2845e; }
  .cat-cuore { --cat: var(--c-cuore); } .cat-attivita { --cat: var(--c-attivita); } .cat-respiro { --cat: var(--c-respiro); }
  .cat-sonno { --cat: var(--c-sonno); } .cat-corpo { --cat: var(--c-corpo); }
  .tile[class*="cat-"] .l, .tile[class*="cat-"] .l svg { color: var(--cat); }
  .tile[class*="cat-"] .l { font-weight: 600; }
  .m-chip.on { background: color-mix(in srgb, var(--cat, var(--accent)) 20%, var(--surface)); color: var(--cat, var(--accent)); box-shadow: inset 0 0 0 1.5px var(--cat, var(--accent)); }
  .dd-health .dd-big span { color: var(--cat); }
  .tiles-6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 760px) { .tiles-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  /* ===================== Il dato in primo piano =====================
     Tipografia Apple: SF Pro per il testo, SF Pro Rounded per i numeri (come Fitness e Salute).
     Fuori da Apple: Inter. Ogni card apre con il suo numero; le parole stanno sotto, piccole e grigie. */
  :root {
    --f-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --f-disp: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --f-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  body { font-family: var(--f-text); }
  h1, h2, h3, h4 { font-family: var(--f-disp); }
  .num, .hero-big, .hero-stats b, .cs-v b, .ul-kpi b, .tile .v, .goal-line b, .goal-stats b, .pace-top b, .pace-v, .pv-sum b, .pv-big b,
  .rc-n b, .rc-g b, .met b, .mini .d, .lv-sug b, .dd-t b, .dd-big b, .g-kpi b, .ring text, .zona b, .u-prog span {
    font-family: var(--f-num); font-variant-numeric: tabular-nums; }

  /* scala: large title 34 · titolo 22 · card 17 · testo 15 · nota 13 */
  .pane-head { margin: 6px 4px 0; }
  .pane-head h1 { font-size: 2.125rem; font-weight: 700; letter-spacing: -0.022em; line-height: 1.1; }
  .pane-head span { font-size: .875rem; }
  .sec-title { margin: 22px 4px 0; }
  .sec-title h2, .pv-top h2, .elenco .list-head h2 { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.018em; }
  .sec-title span, .sec-title .link-btn { font-size: .875rem; }
  .card { padding: 16px; border-radius: 20px; }
  .card h3 { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.012em; }
  .card .sub { font-size: .8125rem; margin-bottom: 14px; }

  /* spiegazioni chiuse: un link discreto, si aprono con un tocco */
  details.more, .pv-how { margin-top: 14px; }
  details.more > summary, .pv-how > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    min-height: 32px; font-size: .875rem; font-weight: 600; color: var(--accent); -webkit-user-select: none; user-select: none; }
  details.more > summary::-webkit-details-marker, .pv-how > summary::-webkit-details-marker { display: none; }
  details.more > summary::after, .pv-how > summary::after { content: ''; width: 7px; height: 7px; border: solid currentColor; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translateY(-2px); transition: transform .2s ease; }
  details.more[open] > summary::after, .pv-how[open] > summary::after { transform: rotate(-135deg) translate(-2px, 0); }
  details.more > summary:focus-visible, .pv-how > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  details.more[open] > :not(summary), .pv-how[open] > div { animation: aprendo .22s ease; }
  @keyframes aprendo { from { opacity: 0; transform: translateY(-4px); } }
  .pv-how > div, .goal .fine { font-size: .875rem; line-height: 1.5; color: var(--text-2); }
  .pv-how > summary::before { content: none; }
  .pv-how + .pv-how { margin-top: 0; }
  .goal-top { flex-wrap: wrap; row-gap: 8px; }

  /* ---- Prossima seduta: un numero grande ---- */
  .hero { padding: 20px 18px 16px; border-radius: 24px; }
  .hero .eyebrow { font-size: .9375rem; font-weight: 600; color: var(--accent); gap: 8px; }
  .hero .eyebrow .fase-tag { font-size: .75rem; font-weight: 600; color: var(--text-2); padding: 3px 9px; border-radius: 999px; margin-left: 2px; }
  .hero h2 { margin: 4px 0 0; font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; }
  .hero-main { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 16px; }
  .hero-big { font-size: clamp(4rem, 19vw, 5.25rem); font-weight: 700; line-height: .9; letter-spacing: -0.035em; color: var(--accent); }
  .hero-big small { font-size: .3em; font-weight: 600; letter-spacing: 0; color: var(--muted); margin-left: 6px; }
  .hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, auto)); justify-content: start; gap: 0 26px; margin: 0; }
  .hero-stats b { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; }
  .hero-stats span { font-size: .8125rem; font-weight: 500; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .timeline { height: 10px; border-radius: 5px; margin-bottom: 8px; }
  .legend-inline { font-size: .75rem; }
  .pi-nota { margin: 12px 0 0; font-size: .875rem; color: var(--text-2); }
  .pi-nota b { font-family: var(--f-num); color: var(--text); }
  .hero details.more .phases, .cal-det .phases { margin-top: 12px; }
  .phases li { font-size: .875rem; line-height: 1.45; }
  .hero .tip, .cal-det .tip { font-size: .875rem; line-height: 1.45; padding: 12px 14px; }
  @media (min-width: 560px) { .hero-main { flex-direction: row; align-items: flex-end; gap: 34px; } .hero-stats { padding-bottom: 6px; } }

  /* ---- Come stai: stato in una riga, tre numeri grandi ---- */
  .come-stai .cs-head { align-items: center; }
  .cs-dot { margin-top: 0; }
  .come-stai .cs-head > div { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; }
  .come-stai h3 { font-size: 1.0625rem; font-weight: 600; }
  .come-stai .cs-head p { margin: 0; font-size: .875rem; }
  .come-stai.warn .cs-head p { color: var(--warn); font-weight: 500; flex-basis: 100%; }
  .cs-vals { gap: 8px; margin-top: 14px; }
  .cs-v { padding: 12px 12px 11px; gap: 6px; border-radius: 16px; }
  .cs-l { display: flex; align-items: center; gap: 5px; font-size: .8125rem; font-weight: 600; color: var(--cat); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cs-l i { display: flex; } .cs-l i svg { width: 15px; height: 15px; }
  .cs-v b { font-size: clamp(1.5rem, 7.4vw, 2rem); font-weight: 600; letter-spacing: -0.025em; line-height: 1; margin: 0; white-space: nowrap; }
  .cs-v b small { font-size: .8125rem; font-family: var(--f-text); letter-spacing: 0; margin-left: 3px; }
  .cs-q { font-size: .75rem; color: var(--muted); }

  /* ---- Ultima corsa ---- */
  .ul-tag { font-size: .875rem; }
  .ul-kpi { gap: 12px 14px; margin-top: 8px; }
  .ul-kpi b { font-size: 1.625rem; font-weight: 600; letter-spacing: -0.025em; line-height: 1.05; }
  .ul-kpi b small, .tile .v small, .rc-n b small, .goal-line b small { font-family: var(--f-text); font-size: .8125rem; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
  .ul-kpi span { font-size: .8125rem; }
  .ul-verdict { font-size: .875rem; }

  /* ---- Settimana ---- */
  .ring-n { font-size: 26px; font-weight: 700; }
  .wk-txt h3 { font-size: 1.0625rem; }
  .wk-txt p { font-size: .9375rem; }
  .coach-more ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: .875rem; line-height: 1.45; color: var(--text-2); }
  .week-card .coach-more { margin-top: 0; }

  /* ---- Obiettivo ---- */
  .goal h2 { font-size: 1.5rem; letter-spacing: -0.02em; }
  .goal-line { gap: 10px 28px; margin: 16px 0; }
  .goal-line b { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; }
  .goal-line span { font-size: .8125rem; }
  .gm-top b { font-size: 1.0625rem; }
  .gm-top span { font-size: .875rem; }

  /* ---- Tessere (Salute, Progressi, Corse) ---- */
  .tile { padding: 14px 14px 13px; border-radius: 18px; }
  .tile .l { font-size: .8125rem; }
  .tile .v { font-size: clamp(1.875rem, 8.4vw, 2.25rem); font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; margin-top: 8px; }
  .tile .n { font-size: .75rem; margin-top: 6px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pace-top b { font-size: 1.625rem; font-weight: 600; letter-spacing: -0.025em; }
  .pv-big b { font-weight: 700; letter-spacing: -0.03em; }
  .rc-n b { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; }
  .rc-g b { font-weight: 700; }
  .rc-g small { text-transform: none; letter-spacing: 0; font-size: .6875rem; font-weight: 600; }
  @media (max-width: 420px) { .rc-n b { font-size: 1.35rem; } }

  /* desktop: più aria, stessi numeri */
  @media (min-width: 760px) {
    .card { padding: 20px; }
    .pane-head h1 { font-size: 2.5rem; }
    .cs-v b { font-size: 2.25rem; }
    .hero { padding: 24px; }
  }

  /* ===================== Info: ciclo, regole con i numeri, elenco che si apre ===================== */
  .nf-hero { position: relative; overflow: hidden; padding: 24px 20px 22px; border-radius: 24px; background: var(--surface); }
  .nf-hero::after { content: ''; position: absolute; inset: auto -30% -70% auto; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 16%, transparent), transparent); pointer-events: none; }
  .nf-hero h2 { text-wrap: balance; margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; }
  .nf-hero p { margin: 6px 0 0; color: var(--muted); font-size: .9375rem; }
  .nf-loop { list-style: none; margin: 24px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .nf-loop li { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; min-width: 0; }
  .nf-loop li + li::before { content: ''; position: absolute; top: 21px; left: calc(-50% + 16px); width: calc(100% - 38px); height: 2px; border-radius: 1px; background: color-mix(in srgb, var(--accent) 35%, var(--line-strong)); }
  .nf-ic { position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 6px;
    background: color-mix(in srgb, var(--accent) 15%, var(--surface)); color: var(--accent); }
  .nf-ic svg { width: 22px; height: 22px; }
  .nf-loop b { font-size: .9375rem; font-weight: 600; }
  .nf-loop small { font-size: .75rem; color: var(--muted); line-height: 1.3; }

  .nf-grid { display: grid; gap: 12px; }
  @media (min-width: 900px) { .nf-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .nf-when { font-size: .8125rem; font-weight: 600; color: var(--accent); }
  .nf-card h3 { margin: 2px 0 14px; }
  .nf-sigs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .nf-sig { min-width: 0; padding: 10px 8px 9px; border-radius: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 3px; }
  .nf-sig b { font-family: var(--f-num); font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; color: var(--cat, var(--text)); white-space: nowrap; }
  .nf-sig span { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nf-then { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: .5px solid var(--line-strong); }
  .nf-then span { font-size: .9375rem; color: var(--text-2); }
  .nf-then b { font-family: var(--f-num); font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--warn); }
  .nf-foot { margin: 8px 0 0; font-size: .8125rem; color: var(--muted); line-height: 1.4; }
  .nf-esiti { list-style: none; margin: 0; padding: 0; }
  .nf-esiti li { display: grid; grid-template-columns: 36px 1fr; column-gap: 12px; align-items: center; padding: 10px 0; border-top: .5px solid var(--line-strong); }
  .nf-esiti li:first-child { border-top: 0; padding-top: 0; }
  .nf-esiti li:last-child { padding-bottom: 0; }
  .nf-e { grid-row: span 2; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 1.05rem; font-weight: 700; }
  .nf-esiti .ok .nf-e { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
  .nf-esiti .warn .nf-e { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
  .nf-esiti .bad .nf-e { color: var(--danger); background: color-mix(in srgb, var(--danger) 15%, transparent); }
  .nf-esiti b { font-size: .9375rem; font-weight: 600; }
  .nf-esiti small { font-size: .8125rem; color: var(--muted); }
  .nf-int { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .nf-int b { flex: none; font-family: var(--f-num); font-size: 2.75rem; font-weight: 700; letter-spacing: -0.035em; line-height: 1; color: var(--accent); }
  .nf-int span { font-size: .875rem; color: var(--text-2); line-height: 1.35; }
  .nf-card .in-int { margin: 0; }

  .nf-list { background: var(--surface); border-radius: 20px; overflow: hidden; }
  .nf-row { position: relative; }
  .nf-row + .nf-row::before { content: ''; position: absolute; top: 0; left: 62px; right: 0; height: .5px; background: var(--line-strong); }
  .nf-row > summary { list-style: none; display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 10px 16px; cursor: pointer; -webkit-user-select: none; user-select: none; }
  .nf-row > summary::-webkit-details-marker { display: none; }

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------------- */
  /* Utility                                                                */
  /* ---------------------------------------------------------------------- */
  const $ = (s) => document.querySelector(s);

  /* Lingua: 'it' | 'en' (salvata nel browser) */
  let LANG = (() => { try { const v = localStorage.getItem('coach-lingua'); if (v === 'it' || v === 'en') return v; } catch (_) {} return 'it'; })();
  let LOC = LANG === 'en' ? 'en-GB' : 'it-IT';
  const T = (it, en) => (LANG === 'en' ? en : it);
  const conLang = (url) => url + (url.indexOf('?') === -1 ? '?' : '&') + 'lang=' + LANG;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let nf1 = new Intl.NumberFormat(LOC, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  let nf0 = new Intl.NumberFormat(LOC, { maximumFractionDigits: 0 });
  const fmt1 = (x) => (x == null ? '–' : nf1.format(x));
  const fmt0 = (x) => (x == null ? '–' : nf0.format(x));
  const fmtSigned = (x) => (x == null ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + nf1.format(Math.abs(x)));
  const fmtPasso = (sec) => {
    if (sec == null || !isFinite(sec)) return '–';
    let m = Math.floor(sec / 60), s = Math.round(sec % 60);
    if (s === 60) { m += 1; s = 0; }
    return m + ':' + String(s).padStart(2, '0');
  };
  const fmtOre = (sec) => (sec == null ? '–' : Math.floor(sec / 3600) + 'h ' + String(Math.round((sec % 3600) / 60)).padStart(2, '0') + '′');
  const fmtDurata = (sec) => {
    if (sec == null) return '–';
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
    return h > 0 ? h + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0') : m + ':' + String(x).padStart(2, '0');
  };
  const fmtDataBreve = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString(LOC, { day: 'numeric', month: 'short', year: 'numeric' });
  const fmtMin = (sec) => (sec == null ? '–' : Math.round(sec / 60) + ' min');
  const fmtData = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString(LOC, { day: '2-digit', month: 'short' });
  const fmtDataLunga = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString(LOC, { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtQuando = (isoTs) => new Date(isoTs).toLocaleString(LOC, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  const giorniDa = (oggi, data) => Math.round((new Date(data + 'T12:00:00') - new Date(oggi + 'T12:00:00')) / 86400000);
  const quando = (oggi, data) => {
    const g = giorniDa(oggi, data);
    if (g < 0) return g === -1 ? T('Ieri', 'Yesterday') : fmtData(data);
    return g === 0 ? T('Oggi', 'Today') : g === 1 ? T('Domani', 'Tomorrow') : g === 2 ? T('Dopodomani', 'In 2 days') : T('Tra ' + g + ' giorni', 'In ' + g + ' days');
  };

  const TIPI = {
    Walk: 'Camminata', Hike: 'Escursione', Ride: 'Bici', VirtualRide: 'Bici indoor', EBikeRide: 'E-bike',
    WeightTraining: 'Pesi', Workout: 'Allenamento', Yoga: 'Yoga', Pilates: 'Pilates', Swim: 'Nuoto',
    Elliptical: 'Ellittica', Rowing: 'Vogatore', HighIntensityIntervalTraining: 'HIIT', Crossfit: 'Crossfit',
    Soccer: 'Calcio', Tennis: 'Tennis', Padel: 'Padel', StairStepper: 'Scale', Other: 'Altro'
  };
  const TIPI_EN = { Walk: 'Walk', Hike: 'Hike', Ride: 'Ride', VirtualRide: 'Indoor ride', WeightTraining: 'Weights', StairStepper: 'Stairs', HighIntensityIntervalTraining: 'HIIT', Other: 'Other' };
  const nomeTipo = (t) => (LANG === 'en' ? TIPI_EN[t] || t : TIPI[t] || t);

  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const alpha = (hex, a) => {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  };

  let toastTimer = null;
  function toast(msg, tipo) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show ' + (tipo || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast ' + (tipo || ''); }, 4200);
  }
  function vaiAlLogin() { window.location.href = '/login.html'; }

  const charts = [];
  let ultimiDati = null;

  /* ---------------------------------------------------------------------- */
  /* Tema chiaro / scuro                                                    */
  /* ---------------------------------------------------------------------- */
  function applicaTema(t, salva) {
    document.documentElement.setAttribute('data-theme', t);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f3f5f8' : '#0b0d10');
    if (salva) { try { localStorage.setItem('coach-tema', t); } catch (e) {} }
    if (ultimiDati) disegnaGrafici(ultimiDati);
  }
  // Suono da tasto di tastiera meccanica ("thock"): pressione piena e sorda + rilascio più leggero.
  // Più chiaro quando accendi (tema chiaro), più grave quando spegni (tema scuro). Sintetizzato, nessun file.
  let audioCtx = null;
  function suonoInterruttore(acceso) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx, t0 = ctx.currentTime + 0.005;
      const uscita = ctx.createGain(); uscita.gain.value = 0.35; uscita.connect(ctx.destination); // volume discreto
      const rumore = (t, dur, passaBasso, passaAlto, vol) => {
        const n = Math.max(1, Math.round(ctx.sampleRate * dur)), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
        for (let k = 0; k < n; k++) d[k] = (Math.random() * 2 - 1) * Math.exp(-6 * k / n);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = passaAlto;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = passaBasso; lp.Q.value = 0.7;
        const g = ctx.createGain(); g.gain.value = vol;
        src.connect(hp).connect(lp).connect(g).connect(uscita); src.start(t);
      };
      const corpo = (t, f, vol, dur) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.7, t + dur);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(uscita); o.start(t); o.stop(t + dur + 0.01);
      };
      const f = acceso ? 1 : 0.82; // spegnere suona un po' più grave
      // pressione: il tasto tocca il fondo
      rumore(t0, 0.032, 2300 * f, 140, 0.85);
      corpo(t0, 260 * f, 0.4, 0.055);
      rumore(t0, 0.006, 4200 * f, 2000, 0.16); // clic del tasto, presente ma morbido
      // rilascio: il tasto risale
      const t1 = t0 + 0.085;
      rumore(t1, 0.016, 2600 * f, 220, 0.2);
      corpo(t1, 360 * f, 0.08, 0.028);
    } catch (_) { /* audio non disponibile: nessun suono */ }
  }
  $('#btn-tema').addEventListener('click', () => {
    const nuovo = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    suonoInterruttore(nuovo === 'light');
    applicaTema(nuovo, true);
  });
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
    let scelto = null;
    try { scelto = localStorage.getItem('coach-tema'); } catch (_) {}
    if (!scelto) applicaTema(e.matches ? 'light' : 'dark', false);
  });
  applicaTema(document.documentElement.getAttribute('data-theme') || 'dark', false);

  /* ---------------------------------------------------------------------- */
  /* Rendering                                                              */
  /* ---------------------------------------------------------------------- */

  const ICO = {
    flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.8 7-6.8 0-3.6-2.4-5.6-3.6-8.2-.4 1.8-1.3 3-2.6 3.6C13.2 7 11.6 4.2 9 2c.3 3.4-1.4 5.4-2.9 7.4C5 10.8 5 12.6 5 15.2 5 19.2 8 22 12 22z"/></svg>',
    body: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.2"/><path d="M6 9.5h12M12 9.5v5.5M12 15l-3 6M12 15l3 6"/></svg>',
    o2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5s-6 6.6-6 11.1a6 6 0 0 0 12 0C18 9.1 12 2.5 12 2.5z"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r="0.6" fill="currentColor"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M12 14v5M9.5 16.5 12 19l2.5-2.5"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
    wave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    steps: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.4C4 11.5 3 10.5 3 8c0-2.7 1.5-6 4.5-6C9.4 2 10 3.8 10 5.5c0 3.1-2 5.7-2 8.7V16a2 2 0 1 1-4 0z"/><path d="M20 20v-2.4c0-2.1 1-3.1 1-5.6 0-2.7-1.5-6-4.5-6C14.6 6 14 7.8 14 9.5c0 3.1 2 5.7 2 8.7V20a2 2 0 1 0 4 0z"/></svg>'
  };

  function renderBadge(d) {
    const b = $('#badge-dati');
    if (d.sorgente_dati === 'simulati') { b.textContent = T('Dati simulati', 'Sample data'); b.className = 'badge sim'; b.hidden = false; }

    else { b.hidden = true; }
  }

  function renderSyncInfo(d) {
    const s = d.sincronizzazione || {};
    const el = $('#sync-info');
    const e = s.ultimo_esito;
    if (!s.configurata) el.innerHTML = T('<span class="err">Intervals.icu non collegato</span> · inserisci API key e Athlete ID nel tuo profilo (avatar in alto)', '<span class="err">Intervals.icu not connected</span> · add your API key and Athlete ID in your profile (avatar at the top)');
    else if (e && e.ok === false) el.innerHTML = T('<span class="err">Ultima sincronizzazione fallita:</span> ', '<span class="err">Last sync failed:</span> ') + esc(e.errore);
    else if (s.ultimo_sync) el.innerHTML = T('Ultima sincronizzazione <b>', 'Last sync <b>') + esc(fmtQuando(s.ultimo_sync)) + '</b>';
    else el.textContent = T('Nessuna sincronizzazione ancora eseguita', 'No sync yet');
    // lo stato finisce nel suggerimento del pallino; in caso di problemi compare un puntino rosso
    const b = $('#btn-sync');
    b.title = T('Sincronizza', 'Sync') + ' · ' + el.textContent;

    b.classList.toggle('err', Boolean(el.querySelector('.err')));
  }

  /* ---- Calendario delle sedute ---- */
  let meseCal = null;       // 'YYYY-MM' mostrato
  let giornoSel = null;     // 'YYYY-MM-DD' selezionato

  const TIPI_SEDUTA_DEF = [
    { tipo: 'corsa-cammino', sigla: ['CC', 'RW'], nome: ['Corsa e cammino', 'Run-walk'], testo: ['Brevi frazioni di corsa lenta alternate a camminata. Abitua cuore, muscoli e tendini a correre senza sovraccaricarli: è la base della ripartenza.', 'Short bouts of slow running alternated with walking. It gets heart, muscles and tendons used to running without overloading them: the foundation of your comeback.'] },
    { tipo: 'facile', sigla: ['F', 'E'], nome: ['Corsa facile', 'Easy run'], testo: ['Corsa continua a ritmo da conversazione (Z2). È l’80% del lavoro: costruisce la resistenza aerobica. Con “allunghi” chiudi con 4 accelerazioni da 20″ per la tecnica.', 'Continuous running at conversational pace (Z2). It is 80% of the work: it builds aerobic endurance. With “strides” you finish with 4 × 20″ accelerations for technique.'] },
    { tipo: 'lungo', sigla: ['L', 'L'], nome: ['Lungo', 'Long run'], testo: ['La seduta chiave, sempre la domenica: corsa lenta e costante che cresce di settimana in settimana fino a quasi 2 ore. Prepara il corpo a durare 21 km.', 'The key session, always on Sunday: slow, steady running that grows week by week up to almost 2 hours. It prepares your body to last 21 km.'] },
    { tipo: 'qualita', sigla: ['Q', 'Q'], nome: ['Qualità', 'Quality'], testo: ['Fartlek (tratti brillanti liberi) o frazioni a ritmo medio / ritmo gara. Insegnano a tenere un passo più sostenuto senza andare in crisi. Solo dalla fase 2.', 'Fartlek (free lively bursts) or reps at steady / race pace. They teach you to hold a faster pace without blowing up. Only from phase 2.'] },
    { tipo: 'recupero', sigla: ['R', 'R'], nome: ['Recupero', 'Recovery'], testo: ['Camminata tranquilla: aiuta a smaltire la fatica senza aggiungere carico.', 'Easy walk: helps clear fatigue without adding load.'] },
    { tipo: 'gara', sigla: ['🏁', '🏁'], nome: ['Gara', 'Race'], testo: ['La gara del tuo obiettivo, a ritmo costante: 5 km, 10 km, mezza o maratona.', 'The race of your goal, at a steady pace: 5K, 10K, half or marathon.'] },
  ];
  const pick = (c) => c[LANG === 'en' ? 1 : 0];
  const tipiSeduta = () => TIPI_SEDUTA_DEF.map((t) => ({ tipo: t.tipo, sigla: pick(t.sigla), nome: pick(t.nome), testo: pick(t.testo) }));
  const tipiChiusi = () => { let v = null; try { v = localStorage.getItem('coach-tipi-chiusi'); } catch (_) {} return v == null ? window.innerWidth < 600 : v === '1'; };
  const siglaTipo = (t) => (tipiSeduta().find((x) => x.tipo === t) || { sigla: '?' }).sigla;

  function renderCalendario(d) {
    const p = d.programma;
    const perData = new Map(p.calendario.map((x) => [x.data, x]));
    if (!meseCal) meseCal = (d.oggi < p.inizio ? p.inizio : d.oggi).slice(0, 7);
    if (!giornoSel || !perData.has(giornoSel)) giornoSel = (p.prossime[0] || p.calendario[0]).data;

    const [y, m] = meseCal.split('-').map(Number);
    const primo = new Date(Date.UTC(y, m - 1, 1));
    const giorniMese = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const offset = (primo.getUTCDay() + 6) % 7; // lunedì = 0
    const titolo = primo.toLocaleDateString(LOC, { month: 'long', year: 'numeric', timeZone: 'UTC' });
    const minMese = p.inizio.slice(0, 7), maxMese = p.fine.slice(0, 7);

    let celle = '';
    for (let i = 0; i < offset; i++) celle += '<div class="cd vuoto"></div>';
    for (let g = 1; g <= giorniMese; g++) {
      const iso = y + '-' + String(m).padStart(2, '0') + '-' + String(g).padStart(2, '0');
      const x = perData.get(iso);
      const cls = ['cd'];
      if (iso === d.oggi) cls.push('oggi');
      if (x) cls.push('seduta', x.fatta ? 'fatta' : x.passata ? 'saltata' : 'futura');
      if (x && x.tipo === 'gara') cls.push('gara');
      if (x && x.adattata) cls.push('adattata');
      if (x && iso === giornoSel) cls.push('sel');
      const stato = x ? (x.fatta ? T(' · fatta', ' · done') : x.passata ? T(' · saltata', ' · missed') : '') : '';
      celle += x
        ? '<button type="button" class="' + cls.join(' ') + '" data-giorno="' + iso + '" aria-label="' + esc(fmtDataLunga(iso) + ': ' + x.blocchi + stato) + '">' +
            '<span class="g">' + g + '</span><span class="m"><i>' + siglaTipo(x.tipo) + '</i>' + (x.tipo === 'gara' ? '' : x.durata_min + '′') + '</span></button>'
        : '<div class="' + cls.join(' ') + '"><span class="g">' + g + '</span></div>';
    }

    const x = perData.get(giornoSel);
    let det = '<div class="empty">' + T('Tocca un giorno colorato per vedere la seduta.', 'Tap a coloured day to see the session.') + '</div>';
    if (x) {
      const stato = x.fatta ? ['fatta', x.manuale ? T('✓ Fatta (a mano)', '✓ Done (manual)') : T('✓ Fatta', '✓ Done')] : x.passata ? ['saltata', T('Saltata', 'Missed')] : x.data === d.oggi ? ['oggi', T('Oggi', 'Today')] : ['futura', quando(d.oggi, x.data)];
      const tipo = tipiSeduta().find((t) => t.tipo === x.tipo);
      // Copia per AI solo per le sedute fatte: prima non ci sono dati da commentare
      let azioni = x.fatta ? '<button type="button" class="btn-mini primary" data-copia="' + x.data + '">' + ICO.copy + T('Copia per AI', 'Copy for AI') + '</button>' : '';
      if (x.fatta && ultimoStorico && ultimoStorico.corse.some((c) => c.data === x.data)) {
        azioni += '<button type="button" class="btn-mini" data-apri-corsa="' + x.data + '">' + T('Vedi i dati della corsa', 'View run data') + '</button>';
      }
      if (x.data <= d.oggi && (!x.fatta || x.manuale)) {
        azioni += '<button type="button" class="btn-mini" data-segna="' + x.data + '">' + (x.manuale ? T('Annulla “fatta”', 'Undo “done”') : T('Segna come fatta', 'Mark as done')) + '</button>';
      }
      det = '<div class="cal-det" id="cal-det">' +
        '<div class="cal-det-head"><div><b>' + esc(fmtDataLunga(x.data)) + ' · ' + esc(p.ora) + '</b>' +
        '<span>' + esc(x.fase) + T(' · sett. ' + x.settimana, ' · wk ' + x.settimana) + (x.scarico ? T(' · scarico', ' · recovery week') : '') + '</span></div>' +
        '<span class="stato ' + stato[0] + '">' + esc(stato[1]) + '</span></div>' +
        '<h4 class="det-title"><span class="sig">' + siglaTipo(x.tipo) + '</span>' + esc(x.titolo.replace(/^(Sett\.|Wk) \d+ · /, '')) + '</h4>' +
        bannerAdattata(x) + confrontoPasso(x) + corpoSeduta(x, true, tipo ? '<p class="det-why">' + esc(tipo.testo) + '</p>' : '') + '<div class="azioni">' + azioni + '</div></div>';
    }

    const tipiUsati = new Set(p.calendario.map((c) => c.tipo));
    const tipi = tipiSeduta().filter((t) => tipiUsati.has(t.tipo)).map((t) =>
      '<div class="tipo-s' + (x && x.tipo === t.tipo ? ' on' : '') + '"><span class="sig">' + t.sigla + '</span><div><b>' + esc(t.nome) + '</b><p>' + esc(t.testo) + '</p></div></div>').join('');

    return '<section class="card cal" id="cal">' +
      '<div class="cal-top"><div><h3>' + T('Calendario allenamenti', 'Training calendar') + '</h3><p class="sub" style="margin:0">' + p.calendario.length + T(' sedute alla gara · 3 a settimana', ' sessions to race day · 3 a week') + '</p></div>' +
        '<a class="btn-mini" href="' + conLang('/api/programma.ics') + '" download title="' + T('Scarica le sedute in programma per Calendario iPhone/Mac, Google o Outlook', 'Download planned sessions for iPhone/Mac Calendar, Google or Outlook') + '">' + ICO.cal + T('Esporta', 'Export') + '</a></div>' +
      '<div class="cal-layout"><div class="cal-left">' +
        '<div class="cal-head"><button type="button" class="icon-btn sm" data-mese="-1" aria-label="' + T('Mese precedente', 'Previous month') + '"' + (meseCal <= minMese ? ' disabled' : '') + '>‹</button>' +
          '<h3>' + esc(titolo) + '</h3>' +
          '<button type="button" class="icon-btn sm" data-mese="1" aria-label="' + T('Mese successivo', 'Next month') + '"' + (meseCal >= maxMese ? ' disabled' : '') + '>›</button></div>' +
        '<div class="cal-grid cal-dow">' + T('LMMGVSD', 'MTWTFSS').split('').map((c) => '<span>' + c + '</span>').join('') + '</div>' +
        '<div class="cal-grid">' + celle + '</div>' +
        '<div class="legend-inline" style="margin-top:12px"><span><i style="background:var(--accent)"></i>' + T('Fatta', 'Done') + '</span>' +
          '<span><i style="background:color-mix(in srgb, var(--accent-2) 22%, transparent);outline:1.5px solid var(--accent-2)"></i>' + T('In programma', 'Planned') + '</span>' +
          '<span><i style="outline:1.5px dashed var(--muted)"></i>' + T('Saltata', 'Missed') + '</span>' +
          '<span><i style="outline:1.5px solid var(--warn)"></i>' + T('Adattata ai tuoi dati', 'Adapted to your data') + '</span></div>' +
      '</div><div class="cal-right">' + det + '</div></div>' +
    '</section>';
  }

  async function copiaPerAI(data, btn) {
    try {
      const res = await fetch(conLang('/api/sessione/' + data + '/markdown'), { credentials: 'same-origin', cache: 'no-store' });
      if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.errore || T('Errore ', 'Error ') + res.status); }
      const md = await res.text();
      try {
        await navigator.clipboard.writeText(md);
      } catch (_) {
        // Fallback per contesti non sicuri (http su rete locale)
        const ta = document.createElement('textarea');
        ta.value = md; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      if (btn) { const t = btn.innerHTML; btn.innerHTML = T('✓ Copiato', '✓ Copied'); setTimeout(() => { btn.innerHTML = t; }, 1800); }
      toast(T('Copiato in Markdown: incollalo in Claude o in un’altra AI', 'Copied as Markdown: paste it into Claude or another AI'), 'ok');
    } catch (e) { toast(e.message, 'err'); }
  }

  async function segnaFatta(data) {
    try {
      const res = await fetch(conLang('/api/seduta/' + data + '/fatta'), { method: 'POST', credentials: 'same-origin', headers: { 'X-Requested-With': 'coach' } });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.errore || T('Operazione non riuscita', 'Operation failed'));
      toast(out.fatta ? T('Seduta segnata come fatta', 'Session marked as done') : T('Segnatura annullata', 'Mark removed'), 'ok');
      await caricaDati(true);
    } catch (e) { toast(e.message, 'err'); }
  }

  document.addEventListener('click', (e) => {
    const copia = e.target.closest('[data-copia]');
    if (copia) { copiaPerAI(copia.dataset.copia, copia); return; }
    const segna = e.target.closest('[data-segna]');
    if (segna) { segnaFatta(segna.dataset.segna); return; }
    const apri = e.target.closest('[data-apri-corsa]');
    if (apri) { apriCorsaDelGiorno(apri.dataset.apriCorsa); return; }
    const nav = e.target.closest('[data-mese]');
    const day = e.target.closest('[data-giorno]');
    if (!nav && !day) return;
    if (nav) {
      const [y, m] = meseCal.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1 + Number(nav.dataset.mese), 1));
      meseCal = dt.getUTCFullYear() + '-' + String(dt.getUTCMonth() + 1).padStart(2, '0');
    } else {
      giornoSel = day.dataset.giorno;
      meseCal = giornoSel.slice(0, 7);
    }
    const vecchio = $('#cal');
    if (!vecchio || !ultimiDati) return;
    vecchio.outerHTML = renderCalendario(ultimiDati);
    if (day) {
      const det = $('#cal-det');
      const r = det && det.getBoundingClientRect();
      if (r && (r.top < 80 || r.bottom > window.innerHeight)) det.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  /* ---- Seduta: struttura ---- */
  function timelineSeduta(s) {
    const tot = s.segmenti.reduce((t, x) => t + x.min, 0);
    const nomi = { walk: T('Camminata', 'Walk'), run: T('Corsa', 'Run'), fast: T('Ritmo', 'Pace'), cool: T('Defaticamento', 'Cool-down') };
    const segs = s.segmenti.map((x) => '<div class="seg ' + x.tipo + '" style="width:' + (x.min / tot * 100).toFixed(2) + '%" title="' + nomi[x.tipo] + ' ' + x.min + '′"></div>').join('');
    const usati = new Set(s.segmenti.map((x) => x.tipo));
    const leg = [['run', nomi.run, 'var(--accent)'], ['fast', nomi.fast, 'var(--orange)'], ['walk', nomi.walk, 'color-mix(in srgb, var(--muted) 45%, transparent)'], ['cool', nomi.cool, 'color-mix(in srgb, var(--accent-2) 55%, transparent)']]
      .filter((l) => usati.has(l[0])).map((l) => '<span><i style="background:' + l[2] + '"></i>' + l[1] + '</span>').join('');
    return '<div class="timeline" role="img" aria-label="' + T('Struttura della seduta', 'Session structure') + '">' + segs + '</div><div class="legend-inline">' + leg + '</div>';
  }

  // compatto (scheda Oggi): un numero grande, struttura e consigli si aprono con un tocco
  function corpoSeduta(s, compatto, intro) {
    const pi = passoIndicativo(s);
    const fasi = s.struttura.map((f) => '<li><span class="m">' + f.min + '′</span><span><b>' + esc(f.fase) + '</b> · ' + esc(f.testo) + '</span></li>').join('');
    const st = (v, l) => '<div><b class="num">' + v + '</b><span>' + l + '</span></div>';
    const notaPasso = pi ? '<p class="pi-nota">' + T('Passo ', 'Pace ') + '<b>' + pi.valore + '/km</b> · ' + esc(pi.nota) + '</p>' : '';
    const tip = '<div class="tip">' + esc(s.nota) + (s.tipo === 'gara' ? '' : T(' Se senti dolore (non semplice fatica), fermati e cammina.', ' If you feel pain (not just fatigue), stop and walk.')) + '</div>';
    return '<div class="hero-main"><b class="hero-big num">' + s.durata_min + '<small>min</small></b>' +
      '<div class="hero-stats">' +
        st(s.corsa_min + '′', T('di corsa', 'running')) +
        st(esc(s.fc_target), T('FC bpm', 'HR bpm')) +
        (pi ? st(pi.valore, T('passo /km', 'pace /km')) : '') +
      '</div></div>' +
      timelineSeduta(s) +
      (compatto
        ? '<details class="more"><summary>' + T('Come si svolge', 'How it goes') + '</summary>' + (intro || '') + notaPasso + '<ul class="phases">' + fasi + '</ul>' + tip + '</details>'
        : notaPasso + '<ul class="phases">' + fasi + '</ul>' + tip);
  }

  function bannerAdattata(s) {
    if (!s.adattata) return '';
    return '<div class="adapt">⚙︎ <b>' + T('Adattata ai tuoi dati', 'Adapted to your data') + '</b> · ' + esc(s.adattata.motivi.join(', ')) +
      T('. Prevista: ', '. Planned: ') + esc(s.adattata.originale) + '.</div>';
  }
