# Intestazioni di sicurezza, incluse in ogni location che ne aggiunge altre
# (in nginx un add_header dentro una location annulla quelli ereditati dal server).

# Content-Security-Policy: script solo dal frontend (niente inline, eval o CDN).
# Eccezioni motivate:
#   style-src 'unsafe-inline'   attributi style="" generati dall'app (larghezze, colori dei grafici)
#   img-src *.googleusercontent foto profilo dell'account Google
#   tiles.openfreemap.org       stile, tasselli, font e icone della mappa (MapLibre)
#   clarity.maptiles.arcgis.com immagini satellitari (Esri World Imagery Clarity) della mappa delle corse
#   media-src blob:             anteprima del video del percorso creato sul dispositivo (Condividi)
#   worker-src/child-src blob:  MapLibre disegna la mappa in un web worker creato da blob
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com https://tiles.openfreemap.org https://clarity.maptiles.arcgis.com; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org https://clarity.maptiles.arcgis.com; media-src 'self' blob:; worker-src 'self' blob:; child-src blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Solo HTTPS per un anno, anche per i sottodomini (aac.run e' servito solo via Cloudflare in HTTPS)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), browsing-topics=()" always;
