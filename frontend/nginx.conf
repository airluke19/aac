# AAC frontend: file statici + proxy verso il backend (servizio "backend" nella rete di Compose).
# L'app (index.html) si apre solo dopo il controllo d'accesso del backend (/auth/verifica).

# DNS interno di Docker: l'indirizzo del backend si riaggiorna se il container viene ricreato
# (e nginx parte anche se il backend non e' ancora raggiungibile).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream aac_backend {
    zone aac_backend 64k;
    server backend:3000 resolve;
    keepalive 16;
}

# IP reale del visitatore: davanti c'e' Cloudflare (tunnel), che lo mette in CF-Connecting-IP.
# Ci si fida dell'intestazione solo se la richiesta arriva da una rete privata/locale
# (cloudflared sull'host -> rete Docker); la porta del frontend e' pubblicata solo su 127.0.0.1.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

map $http_x_forwarded_proto $aac_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Limiti di frequenza per IP (OWASP: protezione da brute force, abuso e DoS applicativo)
limit_req_zone  $binary_remote_addr zone=aac_login:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=aac_sync:10m  rate=6r/m;
limit_req_zone  $binary_remote_addr zone=aac_api:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=aac_web:10m   rate=20r/s;
limit_conn_zone $binary_remote_addr zone=aac_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    autoindex off;

    root /usr/share/nginx/html;
    charset utf-8;

    # Richieste piccole e lente tagliate presto (slowloris, corpi enormi)
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn aac_conn 30;
    limit_req zone=aac_web burst=60 nodelay;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/calendar;

    # Intestazioni di sicurezza (anche sulle risposte di errore)
    include /etc/nginx/snippets/security-headers.conf;

    # Redirect relativi: niente porta interna 8080 negli indirizzi
    absolute_redirect off;

    proxy_http_version 1.1;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_connect_timeout 5s;

    # Healthcheck del container (non tocca il backend)
    location = /frontend-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Backend: API, login Google, demo, healthcheck ----
    location /api/ {
        limit_req zone=aac_api burst=40 nodelay;
        proxy_pass http://aac_backend;
        # la sincronizzazione con Intervals puo' richiedere qualche secondo
        proxy_read_timeout 120s;
        # dati personali: mai in cache (browser o proxy)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /api/sync {
        limit_req zone=aac_sync burst=3 nodelay;
        proxy_pass http://aac_backend;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    # sedute del piano scritte nel calendario di Intervals.icu: stesso limite del sync (chiamate esterne)
    location = /api/intervals/sedute {
        limit_req zone=aac_sync burst=3 nodelay;
        proxy_pass http://aac_backend;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location /auth/ {
        limit_req zone=aac_api burst=20 nodelay;
        proxy_pass http://aac_backend;
    }
    # Avvio e ritorno del login Google: limite stretto contro abusi e tentativi ripetuti
    location ~ ^/auth/google(/callback)?$ {
        limit_req zone=aac_login burst=10 nodelay;
        proxy_pass http://aac_backend;
    }
    location = /demo { limit_req zone=aac_login burst=10 nodelay; proxy_pass http://aac_backend; }
    location = /demo/esci { proxy_pass http://aac_backend; }
    location = /healthz { proxy_pass http://aac_backend; }

    # ---- Controllo d'accesso per l'app ----
    location = /_auth {
        internal;
        proxy_pass http://aac_backend/auth/verifica;
        proxy_pass_request_body off;
        # proxy_set_header qui annulla quelli del server: si reincludono
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @login {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 302 $aac_vai;
    }
    location @attesa {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 302 /login.html?stato=$aac_stato;
    }

    location = / {
        auth_request /_auth;
        auth_request_set $aac_vai $upstream_http_x_aac_vai;
        auth_request_set $aac_stato $upstream_http_x_aac_stato;
        error_page 401 = @login;
        error_page 403 = @attesa;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }
    location = /index.html { return 301 /; }

    # ---- Pubblici: pagina di login e risorse statiche ----
    location = /login.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # CSS e JS hanno ?v=<hash> nel link, i file in /vendor la versione nel nome:
    # si possono tenere in cache a lungo.
    location ~ ^/(css|js|vendor)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # App installabile (PWA): manifest e service worker pubblici, sempre ricontrollati
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /sw.js {
        types { } default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ \.(svg|png|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Tutto il resto non esiste: niente elenco di cartelle, niente file nascosti
    location / {
        return 404;
    }
}
