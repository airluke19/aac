# Intestazioni verso il backend (incluse anche nelle location con proxy_set_header propri,
# che altrimenti annullerebbero quelle ereditate dal server).
proxy_set_header Connection "";
# Host originale con la porta ($host la toglie): il backend lo confronta con PUBLIC_URL
proxy_set_header Host $http_host;
# IP reale (gia' ricavato da CF-Connecting-IP): si sostituisce, non si accoda a quanto manda il client
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $aac_proto;
proxy_set_header X-Forwarded-Host $http_host;
# Intestazione del vecchio setup oauth2-proxy: mai accettarla dal client
proxy_set_header X-Forwarded-Email "";
