name: ai-adaptive-coach
# Due ambienti sulla stessa macchina (cartelle /opt/aac/production e /opt/aac/staging), ognuno col suo .env:
#   COMPOSE_PROJECT_NAME  progetto Compose (production: ai-adaptive-coach, staging: aac-staging)
#   AAC_PREFIX            prefisso di container e volumi (default aac; staging: aac-staging; production oggi: coach)
#   AAC_TAG               immagine (production: latest = branch main, staging: staging)
#   HOST_PORT             porta su 127.0.0.1 (production: 8088, staging: 8089)
#   LOGIN_GOOGLE          on/off (off = utente singolo, solo accesso locale)
#   AAC_AMBIENTE          production/staging (staging = badge BETA)
#   COMPOSE_PROFILES      backup = servizio di backup attivo (production); assente = nessun backup (staging)

# ---------------------------------------------------------------------------
# Due servizi:
#   frontend  nginx: serve l'app e inoltra /api, /auth e /demo al backend.
#             E' l'unico esposto sull'host (porta HOST_PORT, default 3000).
#   backend   Node: API, login, sync con Intervals.icu, motore del piano.
#             Raggiungibile solo dal frontend, sulla rete interna di Compose.
#   backup    Backup notturno verificato dei database nel volume <prefisso>-backup (senza rete).
#             Ripristino: docker compose stop backend
#                         docker compose run --rm backup node restore.js [AAAA-MM-GG_HHMM]
#                         docker compose start backend
# Immagini pubblicate da GitHub Actions su ghcr.io: :staging dal branch staging,
# :latest dal branch main, sha-<commit> per ogni build (stesso tag per entrambe).
# AAC_TAG nel .env sceglie il tag (default latest).
# Deploy: docker compose pull && docker compose up -d
# Build locale di riserva: docker compose up -d --build
# ---------------------------------------------------------------------------
# Limiti comuni: log ruotati (max 3 x 10 MB) per non riempire il disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    image: ghcr.io/airluke19/aac-frontend:${AAC_TAG:-latest}
    build:
      context: ./frontend
    container_name: ${AAC_PREFIX:-aac}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Di default solo 127.0.0.1 (es. tunnel Cloudflare sullo stesso host). BIND_ADDR=0.0.0.0
      # nel .env serve solo se il reverse proxy e' su un'altra macchina.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:8080"
    logging: *logging
    mem_limit: 128m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Documentazione pubblica (docs.aac.run): sito statico, nessun login. Solo con COMPOSE_PROFILES=...,docs
  docs:
    profiles: ["docs"]
    image: ghcr.io/airluke19/aac-docs:${AAC_TAG:-latest}
    build:
      context: ./docs
    container_name: ${AAC_PREFIX:-aac}-docs
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DOCS_PORT:-3001}:8080"
    logging: *logging
    mem_limit: 64m
    pids_limit: 32
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    image: ghcr.io/airluke19/aac-backend:${AAC_TAG:-latest}
    build:
      context: ./backend
      secrets:
        - extra_ca
    container_name: ${AAC_PREFIX:-aac}-backend
    restart: unless-stopped
    # Nessuna porta sull'host: ci arriva solo il frontend.
    expose:
      - "3000"
    environment:
      TZ: Europe/Rome
      PORT: "3000"
      DB_PATH: /data/corse.db
      INTERVALS_API_KEY: ${INTERVALS_API_KEY:-}
      INTERVALS_ATHLETE_ID: ${INTERVALS_ATHLETE_ID:-}
      SYNC_CRON: ${SYNC_CRON:-*/30 * * * *}
      # Eta' iniziale del primo utente (admin), per stimare la FC massima; poi si cambia dal profilo
      ATHLETE_AGE: ${ATHLETE_AGE:-33}
      # Programma di ripartenza corsa/cammino (8 settimane): data della prima seduta
      PROGRAMMA_INIZIO: ${PROGRAMMA_INIZIO:-}
      PROGRAMMA_ORA: ${PROGRAMMA_ORA:-06:30}
      # Account e login con Google (vuoti = utente singolo, nessun login).
      # Dopo il primo avvio chiave Intervals, Athlete ID e programma si gestiscono dal profilo nell'app.
      PUBLIC_URL: ${PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      APP_SECRET: ${APP_SECRET:-}
      # off = login Google spento (utente singolo): il backend rifiuta le richieste da internet
      LOGIN_GOOGLE: ${LOGIN_GOOGLE:-on}
      # staging = badge BETA nell'app e nel titolo della pagina
      AAC_AMBIENTE: ${AAC_AMBIENTE:-production}
      # CA aggiuntiva (proxy aziendale) per le chiamate a Intervals.icu
      NODE_EXTRA_CA_CERTS: /etc/extra-ca.pem
    logging: *logging
    mem_limit: 768m
    pids_limit: 128
    volumes:
      - coach-db:/data
      - ${EXTRA_CA_FILE:-./.no-extra-ca}:/etc/extra-ca.pem:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backup:
    image: ghcr.io/airluke19/aac-backup:${AAC_TAG:-latest}
    build:
      context: ./aac-backup
    container_name: ${AAC_PREFIX:-aac}-backup
    # Attivo solo con il profilo "backup" (COMPOSE_PROFILES=backup nel .env, gia' in .env.example):
    # senza profilo il servizio non parte e il suo volume non viene nemmeno creato (es. staging).
    profiles: ["backup"]
    restart: unless-stopped
    # Non ha bisogno di rete: legge i database e scrive nel volume dei backup
    network_mode: none
    environment:
      TZ: Europe/Rome
      # Ogni notte alle 03:30 (all'avvio ne fa uno subito se l'ultimo ha piu' di 24 ore)
      BACKUP_CRON: ${BACKUP_CRON:-30 3 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
    volumes:
      # in scrittura solo perche' SQLite in modalita' WAL lo richiede anche ai lettori;
      # il backup apre i database in sola lettura
      - coach-db:/data
      - coach-backup:/backups
    logging: *logging
    mem_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  # Certificato CA opzionale per reti con ispezione TLS (es. Netskope).
  # Impostalo in .env con EXTRA_CA_FILE=/percorso/ca.pem; altrimenti resta vuoto.
  extra_ca:
    file: ${EXTRA_CA_FILE:-./.no-extra-ca}

volumes:
  coach-db:
    name: ${AAC_PREFIX:-aac}-db
  coach-backup:
    name: ${AAC_PREFIX:-aac}-backup
